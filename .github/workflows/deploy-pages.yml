name: Publish CPA website

on:
  push:
    branches: [codex/github-pages-question-bank]
    paths:
      - 'site/**'
      - 'question-bank/**'
      - 'scripts/build-pages.mjs'
      - 'tests/pages-*.test.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpa-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - name: Build independent website and question bank
        run: node scripts/build-pages.mjs
      - name: Verify question integrity and practice recovery
        run: node --test tests/pages-bank.test.mjs tests/pages-runtime.test.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
